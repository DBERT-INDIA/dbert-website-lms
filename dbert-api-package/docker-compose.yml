version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dbert_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://dbert_user:${POSTGRES_PASSWORD:-dbert_secure_pass_2026}@db:5432/${POSTGRES_DB:-dbert_db}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dbert_network

  db:
    image: postgres:15-alpine
    container_name: dbert_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dbert_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dbert_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-dbert_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dbert_user} -d ${POSTGRES_DB:-dbert_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dbert_network

  nginx:
    image: nginx:alpine
    container_name: dbert_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./uploads:/app/uploads:ro
    depends_on:
      - backend
    networks:
      - dbert_network

volumes:
  pgdata:
    driver: local

networks:
  dbert_network:
    driver: bridge
