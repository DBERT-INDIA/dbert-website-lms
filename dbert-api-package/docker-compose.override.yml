# Local Development Overrides
# Automatically loaded alongside docker-compose.yml for local debugging
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app/backend
      - ./uploads:/app/uploads
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - RELOAD=true
    ports:
      - "8000:8000"

  postgres:
    ports:
      - "5432:5432"
