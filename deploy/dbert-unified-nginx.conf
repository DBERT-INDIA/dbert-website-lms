# ==============================================================================
# DBERT Production Ecosystem — Unified Nginx Reverse Proxy Configuration
# Target: /etc/nginx/sites-available/dbert-unified.conf
# Enabled: /etc/nginx/sites-enabled/dbert-unified.conf
# ==============================================================================

# Rate limiting zones for edge security (Finding R5-08)
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=general_api_limit:10m rate=30r/m;

# ── 1. Global HTTP -> HTTPS Redirection & Let's Encrypt ACME Challenge ───────
server {
    listen 80;
    listen [::]:80;
    server_name dbert.in www.dbert.in lms.dbert.in api.dbert.in;

    # Certbot challenge validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 1-hop HTTP redirect for legacy domains (Finding R4-10)
server {
    listen 80;
    listen [::]:80;
    server_name dbert.online www.dbert.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://dbert.in$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name internship.dbert.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://lms.dbert.in$request_uri;
    }
}

# ── 2. Legacy Domain 301 Permanent Redirects (HTTPS) ─────────────────────────
# Redirect legacy dbert.online -> https://dbert.in
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dbert.online www.dbert.online;

    ssl_certificate /etc/letsencrypt/live/dbert.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dbert.in/privkey.pem;

    return 301 https://dbert.in$request_uri;
}

# Redirect legacy internship.dbert.online -> https://lms.dbert.in
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name internship.dbert.online;

    ssl_certificate /etc/letsencrypt/live/dbert.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dbert.in/privkey.pem;

    return 301 https://lms.dbert.in$request_uri;
}

# ── 3. DBERT Main Website (https://dbert.in) ──────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dbert.in www.dbert.in;

    ssl_certificate /etc/letsencrypt/live/dbert.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dbert.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Block sensitive files & dotfiles (Findings R5-01, R5-02)
    location ~ /\. {
        deny all;
        return 404;
    }
    location ~* \.(sqlite|db|sql|log|env)$ {
        deny all;
        return 404;
    }

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Custom 404 Error Handling (Finding R3-01)
    error_page 404 /404.html;
    location = /404.html {
        root /var/www/dbert-website-lms/cpanel_public_html;
        internal;
    }

    # Next.js Static Chunks (Serving from build artifact, fallback to proxy)
    location /_next/static/ {
        alias /var/www/dbert-website-lms/apps/website/.next/static/;
        try_files $uri @nextjs_proxy;
        expires 365d;
        access_log off;
    }

    location @nextjs_proxy {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse Proxy to Next.js Node.js Server on port 3001
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60;
    }
}

# ── 4. DBERT LMS Platform (https://lms.dbert.in) ──────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lms.dbert.in;

    ssl_certificate /etc/letsencrypt/live/dbert.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dbert.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 25M;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Block sensitive files & dotfiles (Findings R5-01, R5-02)
    location ~ /\. {
        deny all;
        return 404;
    }
    location ~* \.(sqlite|db|sql|log|env)$ {
        deny all;
        return 404;
    }

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # LMS Static Assets (Direct Disk Serving)
    location /static/ {
        alias /var/www/dbert-website-lms/apps/portal/static/;
        expires 30d;
        access_log off;
    }

    # Edge Rate-Limiting for Sensitive Auth Endpoints (Finding R5-08)
    location ~ ^/(admin/login|signin|company/login|mentor/login) {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 90;
    }

    # Uploads (Proxied to Flask to enforce Phase 15 Auth/IDOR sandbox - Finding R2-06 / R5-02)
    location /uploads/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 90;
    }

    # Reverse Proxy to Flask / Gunicorn LMS on port 5001 (Finding R2-12: X-Forwarded-Host added)
    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 90;
    }
}

# ── 5. DBERT REST API Backend (https://api.dbert.in) ──────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.dbert.in;

    ssl_certificate /etc/letsencrypt/live/dbert.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dbert.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 25M;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Block sensitive files & dotfiles
    location ~ /\. {
        deny all;
        return 404;
    }
    location ~* \.(sqlite|db|sql|log|env)$ {
        deny all;
        return 404;
    }

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # API Static Uploads
    location /uploads/ {
        alias /var/www/dbert-website-lms/dbert-api-package/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Rate-Limiting for Sensitive Auth Endpoints
    location ~ ^/api/v1/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 90;
    }

    # Reverse Proxy to FastAPI Uvicorn on port 8000
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 90;
    }
}

