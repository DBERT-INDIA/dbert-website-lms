# Nginx Configuration for DBERT Main Website
# Target Server Path: /var/www/dbert-website-lms/apps/website
# Domain: https://dbert.online/

# 1. HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name dbert.online www.dbert.online;

    # Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Main HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dbert.online www.dbert.online;

    # SSL Certificates (managed by Certbot / Let's Encrypt)
    # The actual path might differ slightly on Amazon Linux, usually /etc/letsencrypt/live/dbert.online/fullchain.pem
    ssl_certificate /etc/letsencrypt/live/dbert.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dbert.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Reverse Proxy to Next.js Application
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;

        # WebSocket support for Next.js hot reloading (if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
